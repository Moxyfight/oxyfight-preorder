<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-order OXYFIGHT T-Shirt</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-image: url('Comming Soon.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            background-color: #111;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.8); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header img { max-width: 150px; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 32px; text-transform: uppercase; letter-spacing: 2px; }
        .form-container {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        .section-title { font-size: 18px; font-weight: 600; margin: 20px 0 10px 0; padding-bottom: 5px; border-bottom: 2px solid #E62020; color: #E62020; }
        label { font-size: 14px; margin-top: 12px; display: block; color: #ddd; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; font-family: 'Kanit', sans-serif; font-size: 15px; background: #222; color: white; }
        input:focus, select:focus, textarea:focus { border-color: #E62020; outline: none; }
        
        .size-matrix-table { width: 100%; margin-top: 8px; border-collapse: collapse; background: rgba(255, 255, 255, 0.02); border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .size-matrix-table th, .size-matrix-table td { padding: 10px; text-align: center; border: 1px solid #333; }
        .size-matrix-table th { background: rgba(230, 32, 32, 0.1); color: #E62020; font-size: 14px; }
        .size-qty-input { width: 80px !important; padding: 6px !important; margin-top: 0 !important; text-align: center; }

        .payment-methods { display: flex; gap: 10px; margin-top: 10px; }
        .method-btn { flex: 1; background: #111; border: 1px solid #444; padding: 12px 5px; border-radius: 8px; cursor: pointer; text-align: center; color: #aaa; font-family: 'Kanit', sans-serif; font-size: 14px; transition: all 0.3s; }
        .method-btn.active { border-color: #E62020; background: rgba(230, 32, 32, 0.1); color: #fff; }

        .payment-details-box { background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 15px; margin-top: 15px; text-align: center; }
        .bank-info-display { display: none; }
        .bank-info-display.active { display: block; }
        
        .kbank-icon { display: inline-block; width: 24px; height: 24px; background-color: #00A950; color: white; font-weight: bold; font-size: 14px; line-height: 24px; text-align: center; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        .account-number { font-size: 24px; font-weight: 600; color: #fff; margin: 5px 0; letter-spacing: 1px; }
        .account-owner { font-size: 14px; color: #aaa; }
        .price-summary-box { background: rgba(230, 32, 32, 0.15); border: 1px solid #E62020; border-radius: 8px; padding: 12px; margin-top: 15px; text-align: center; font-size: 18px; font-weight: 600; }
        .price-amount { color: #FF4D4D; font-size: 24px; margin: 0 5px; }
        .qr-code-img { max-width: 200px; margin-top: 10px; border: 5px solid white; border-radius: 4px; }
        #imagePreviewContainer { display: none; margin-top: 15px; text-align: center; border: 1px dashed #555; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); }
        #slipPreview { max-width: 100%; max-height: 300px; border-radius: 4px; border: 2px solid #333; }
        button.submit-btn { width: 100%; padding: 15px; background-color: #E62020; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 25px; transition: background 0.3s; text-transform: uppercase; }
        button.submit-btn:hover { background-color: #B31515; }
        .developer-credit { text-align: center; margin-top: 25px; font-size: 12px; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="header">
            <img src="Oxyfight 1-1.png" alt="Oxyfight Logo" onerror="this.style.display='none'">
            <h1>Pre-order</h1>
        </div>

        <div class="form-container">
            <form id="preorderForm">
                <div class="section-title">1. ข้อมูลผู้สั่งซื้อ</div>
                <label>ชื่อ-นามสกุล</label>
                <input type="text" id="nameInput" name="name" required placeholder="กรอกชื่อ-นามสกุล">

                <label>เบอร์โทรศัพท์</label>
                <input type="tel" id="phoneInput" name="phone" required placeholder="08X-XXX-XXXX">

                <label>ระบุจำนวนเสื้อที่ต้องการ</label>
                <table class="size-matrix-table">
                    <thead><tr><th>ไซส์</th><th>อก</th><th>จำนวน</th></tr></thead>
                    <tbody>
                        <tr><td><strong>S</strong></td><td>38"</td><td><input type="number" class="size-qty-input" data-size="S" min="0" value="0"></td></tr>
                        <tr><td><strong>M</strong></td><td>40"</td><td><input type="number" class="size-qty-input" data-size="M" min="0" value="0"></td></tr>
                        <tr><td><strong>L</strong></td><td>42"</td><td><input type="number" class="size-qty-input" data-size="L" min="0" value="0"></td></tr>
                        <tr><td><strong>XL</strong></td><td>44"</td><td><input type="number" class="size-qty-input" data-size="XL" min="0" value="0"></td></tr>
                        <tr><td><strong>2XL</strong></td><td>46"</td><td><input type="number" class="size-qty-input" data-size="2XL" min="0" value="0"></td></tr>
                    </tbody>
                </table>
                <div style="margin-top:12px; font-size:14px; color:#aaa; text-align:right;">รวม: <span id="totalQtyDisplay">0</span> ตัว</div>

                <label>ที่อยู่จัดส่ง</label>
                <textarea id="addressInput" name="address" rows="3" required></textarea>

                <div class="price-summary-box">ยอดรวม: <span class="price-amount" id="totalPriceDisplay">0</span> บาท</div>

                <div class="section-title">2. โอนเงิน</div>
                <div class="payment-methods">
                    <div class="method-btn active" id="btnPromptpay" onclick="selectPayment('promptpay')">พร้อมเพย์</div>
                    <div class="method-btn" id="btnBank" onclick="selectPayment('bank')"><span class="kbank-icon">K</span> กสิกรไทย</div>
                </div>

                <div class="payment-details-box">
                    <div id="promptpayDisplay" class="bank-info-display active">
                        <div id="qrContainer"><p>(กรุณาระบุจำนวนเพื่อสร้าง QR)</p></div>
                    </div>
                    <div id="bankDisplay" class="bank-info-display">
                        <div class="account-number">1318080212</div>
                        <div class="account-owner">นายปยุต ปิ่นรักษา</div>
                    </div>
                </div>

                <label>แนบสลิป</label>
                <input type="file" id="slipInput" accept="image/*" required>
                <div id="imagePreviewContainer"><img id="slipPreview" src="" alt="Slip"></div>

                <button type="submit" class="submit-btn" id="submitBtn">สั่งจองสินค้า</button>
            </form>
            <div class="developer-credit">พัฒนาโดย REDADX.X·© 2026</div>
        </div>
    </div>

    <script>
        const PRICE_PER_SHIRT = 399;
        const PROMPTPAY_NUMBER = '1129701331742';
        const form = document.getElementById('preorderForm');
        const sizeInputs = document.querySelectorAll('.size-qty-input');
        
        let currentTotal = 0;
        let totalQuantity = 0;

        function calculateTotal() {
            totalQuantity = 0;
            sizeInputs.forEach(input => totalQuantity += parseInt(input.value) || 0);
            document.getElementById('totalQtyDisplay').textContent = totalQuantity;
            currentTotal = totalQuantity * PRICE_PER_SHIRT;
            document.getElementById('totalPriceDisplay').textContent = currentTotal.toLocaleString();
            
            if (currentTotal > 0) {
                document.getElementById('qrContainer').innerHTML = `<img src="https://promptpay.io/${PROMPTPAY_NUMBER}/${currentTotal}.png" class="qr-code-img">`;
            }
        }

        function selectPayment(method) {
            document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.bank-info-display').forEach(d => d.classList.remove('active'));
            if (method === 'promptpay') {
                document.getElementById('btnPromptpay').classList.add('active');
                document.getElementById('promptpayDisplay').classList.add('active');
            } else {
                document.getElementById('btnBank').classList.add('active');
                document.getElementById('bankDisplay').classList.add('active');
            }
        }

        sizeInputs.forEach(input => input.addEventListener('input', calculateTotal));

        document.getElementById('slipInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('slipPreview').src = e.target.result;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            };
            reader.readAsDataURL(this.files[0]);
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const file = document.getElementById('slipInput').files[0];
            
            if (totalQuantity <= 0) return alert('กรุณาระบุจำนวนเสื้อ');
            
            btn.disabled = true;
            btn.textContent = 'กำลังส่ง...';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = 500;
                    canvas.getContext('2d').drawImage(img, 0, 0, 500, 500);
                    
                    const params = new URLSearchParams();
                    params.append('name', document.getElementById('nameInput').value);
                    params.append('phone', document.getElementById('phoneInput').value);
                    params.append('quantity', totalQuantity);
                    params.append('address', document.getElementById('addressInput').value);
                    params.append('slipFile', canvas.toDataURL('image/jpeg', 0.6));

                    fetch('https://script.google.com/macros/s/AKfycbzXBleBPv-uXk_wIO554IVhL1WhbeeCMTOk8F3aTHpYp0pQdElMV9CHYeoupizD_7jz/exec', {
                        method: 'POST', body: params
                    }).then(() => {
                        Swal.fire('สำเร็จ', 'สั่งจองเรียบร้อย', 'success').then(() => window.location.reload());
                    }).catch(() => {
                        alert('เกิดข้อผิดพลาด');
                        btn.disabled = false;
                    });
                };
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
